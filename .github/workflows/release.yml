name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  prepare:
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes "Automated draft for $TAG. Review the Linux, macOS and Windows artifacts before publishing." \
            || true

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same pin as the build job so the gate runs on the ABI/toolchain we ship with.
          node-version: '22'
          cache: npm

      - run: npm ci

      # No rebuild:native here on purpose: it compiles better-sqlite3/node-pty for the
      # Electron ABI, while vitest runs on Node. Keeping verify in its own job with a
      # plain `npm ci` keeps both ABIs from clobbering each other.
      - run: npm run typecheck

      - run: npm run test:unit

  # Gate de BOOT: o typecheck/vitest do `verify` roda em Node e não carrega o
  # bundle do Electron — já houve regressão que só aparece no app buildado
  # (path/bundling, ABI nativa). Aqui o app buildado sobe de verdade sob xvfb.
  #
  # Job próprio (e não step do `verify`) porque o smoke precisa de
  # `rebuild:native`, que compila better-sqlite3/node-pty pro ABI do Electron —
  # o oposto do que o vitest do `verify` precisa. Os dois no mesmo job se
  # atropelariam.
  #
  # Sem `needs: verify`: os dois gates são independentes e rodam em paralelo,
  # então o gate custa ~1x o tempo do mais lento, não a soma.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Mesmo pin do job build: o smoke tem que exercitar o ABI que a gente publica.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Rebuild native modules against Electron ABI
        run: npm run rebuild:native

      - run: npm run build

      # Reusa e2e/specs/smoke.spec.ts (asserções ESTRUTURAIS: IconRail + áreas),
      # que não dependem de dados. Um erro no boot do main derruba o teste antes
      # das asserções: `electron.launch()`/`firstWindow()` nunca resolvem.
      #
      # Hermético: CM_REAL_USERDATA aponta pra um path INEXISTENTE, então
      # launchApp() pula a cópia do userData e o app sobe com perfil vazio (sem
      # ~/.config/pitwall, sem ~/.claude, sem repos do usuário). Com perfil vazio
      # o updater no-opa (app.isPackaged false), o syncOnBoot não tem sync/.git,
      # o auto-pull é opt-in por pref e o auto-clone não tem repo — nada de rede
      # autenticada.
      #
      # NÃO cobre "repositório registrado abre sessão": exigiria seed + CLI
      # `claude` autenticado no runner. Fora de escopo de propósito.
      - name: Boot smoke (xvfb)
        run: xvfb-run --auto-servernum npx playwright test e2e/specs/smoke.spec.ts
        env:
          CM_REAL_USERDATA: ${{ runner.temp }}/pitwall-empty-userdata
          # Determinismo no runner headless: sem GPU e sem tentativa de Wayland,
          # o boot não depende de driver nem de compositor.
          CM_DISABLE_GPU: '1'
          CM_DISABLE_WAYLAND: '1'

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, args: '--linux AppImage deb' }
          - { os: macos-latest, args: '--mac dmg zip' }
          # windows-2022: a imagem windows-latest atual não tem Visual Studio
          # detectável pelo node-gyp (rebuild do node-pty falha)
          - { os: windows-2022, args: '--win nsis' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to 22 (not lts/*, which drifted to Node 24): node-pty-prebuilt-multiarch
          # v0.14.0 has no win32 prebuild for Node 24 (ABI v137 -> 404 -> source build fails on
          # Windows), and fix-pty-prebuilds.mjs bridges ABI 127 (Node 22) -> 128 (Electron 32).
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Rebuild native modules against Electron ABI
        run: npm run rebuild:native

      - run: npm run build

      - name: Build and publish
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
