appId: com.thiagomatumoto.pitwall
productName: Pitwall
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron/*'
  - '!shared/*'
  - '!{electron.vite.config.ts,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.eslintrc,.prettierrc,.npmrc}'
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
npmRebuild: false
publish:
  provider: github
  owner: ThiagoEMatumoto
  repo: pitwall
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: thiagoeijimatumoto@gmail.com
  icon: build/icons
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  identity: null
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
